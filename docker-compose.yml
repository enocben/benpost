services:
  back:
    build:
      context: .
      dockerfile: apps/back/Dockerfile
    image: benpost-back:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_SECRET: ${APP_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      FRONT_WEBHOOK_URL: https://blog.benenoc.com/api/webhook/posts
      FRONT_URL: https://blog.benenoc.com
      CORS_ORIGIN: https://blog.benenoc.com
      # ——— LibSQL / Turso ——— (prod)
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN}
      # S3 optionnel
      # S3_ENDPOINT: ${S3_ENDPOINT}
      # S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      # S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      # S3_BUCKET: ${S3_BUCKET}
    networks:
      - benpost

  front:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
    image: benpost-front:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      PUBLIC_API_URL: https://api.blog.benenoc.com
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    depends_on:
      - back
    networks:
      - benpost

networks:
  benpost:
    driver: bridge
